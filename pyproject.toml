[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "recap-team25"
version = "1.0.0"
description = "Reproducible transaction recovery and audit prototype"
requires-python = ">=3.11"
dependencies = [
  "SQLAlchemy==2.0.44", "psycopg[binary]==3.2.12",
  "confluent-kafka==2.12.2", "jsonschema==4.25.1", "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.3", "pytest-cov==7.0.0"]

[project.scripts]
recap = "recap.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/recap/schemas" = ["schemas/*.json"]
"share/recap/migrations" = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires a real PostgreSQL database",
  "end_to_end: requires real Kafka and PostgreSQL",
  "performance: opt-in measurements, not correctness assertions",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
