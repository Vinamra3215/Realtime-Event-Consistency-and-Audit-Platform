name: recap-team25
x-app: &app
  build: .
  image: recap-team25:1.0.0
  environment: &environment
    POSTGRES_HOST: postgres
    POSTGRES_PORT: 5432
    POSTGRES_USER: ${POSTGRES_USER:-recap}
    POSTGRES_DB: ${POSTGRES_DB:-recap}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run recap init-env first}
    KAFKA_BOOTSTRAP_SERVERS: kafka:19092
    RECAP_IMAGE_TAG: recap-team25:1.0.0
  volumes:
    - ./outputs:/app/outputs
    - ./data:/app/data:ro
  depends_on:
    postgres:
      condition: service_healthy
    kafka:
      condition: service_healthy
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-recap}
      POSTGRES_DB: ${POSTGRES_DB:-recap}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run recap init-env first}
    ports:
      - '127.0.0.1:${RECAP_POSTGRES_PORT:-55432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 3s
      timeout: 3s
      retries: 30
  kafka-volume-init:
    image: apache/kafka:4.1.0
    user: '0:0'
    entrypoint: ['/bin/sh', '-c']
    command: ['chown 1000:1000 /var/lib/kafka/data']
    volumes:
      - kafka-data:/var/lib/kafka/data
  kafka:
    image: apache/kafka:4.1.0
    ports:
      - '127.0.0.1:9092:9092'
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD-SHELL', '/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1']
      interval: 5s
      timeout: 5s
      retries: 30
  app:
    <<: *app
    profiles: [tools]
  migrate:
    <<: *app
    command: [migrate]
    profiles: [workers]
  consumer:
    <<: *app
    command: [consume, --forever]
    profiles: [workers]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
  recovery:
    <<: *app
    command: [recover, --forever]
    profiles: [workers]
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
volumes:
  postgres-data:
  kafka-data:
